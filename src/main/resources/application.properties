# ==============================
# إعدادات السيرفر
# ==============================
server.port=${PORT:8080}

# Railway/Render وغيرها من منصات النشر بتستقبل الطلبات بـ HTTPS وبعدين
# بتحوّلها لتطبيقك بـ HTTP عادي داخليًا (SSL Termination). السطر ده بيخلي
# Spring يقرأ هيدر X-Forwarded-Proto عشان يعرف إن الطلب الأصلي كان HTTPS،
# وده بيظهر صح في رابط Swagger وأي روابط بيولّدها التطبيق.
server.forward-headers-strategy=framework

# ==============================
# قاعدة البيانات
# ==============================
# لو موجودة متغيرات بيئة DATABASE_URL/DATABASE_USERNAME/DATABASE_PASSWORD
# (زي ما بيحصل تلقائيًا على Render) هيستخدمها. لو مش موجودة (تشغيل محلي)
# هيستخدم H2 كقيمة افتراضية بدون أي إعداد إضافي منك.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/proddb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# تفعيل H2 console (بيتجاهله تلقائيًا لو مش شغال H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================
# إعدادات Swagger / OpenAPI
# ==============================
# التوثيق التفاعلي: /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==============================
# إعدادات JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
